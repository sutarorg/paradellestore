name: Debug Login
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe debug-admin
        run: |
          set -e
          echo "Fetching debug-admin..."
          curl -sS -i https://paradelle.store/api/debug-admin --max-time 15 || true
          echo "---"
          curl -sS https://paradelle.store/api/debug-admin --max-time 15 || echo "curl failed"
      - name: Probe login
        run: |
          curl -sS -X POST https://paradelle.store/api/admin/auth/login -H "Content-Type: application/json" -d '{"email":"admin@paradelle.store","password":"Iskcon@098"}' -i --max-time 15 || true
